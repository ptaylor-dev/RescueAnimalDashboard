services:
  db:
    image: postgres:18
    container_name: rescue-db
    environment:
      POSTGRES_USER: rescue
      POSTGRES_PASSWORD: rescue_dev_password
      POSTGRES_DB: rescueanimals
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescue -d rescueanimals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: